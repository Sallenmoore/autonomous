# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "dev", "test", "main" ]
  pull_request:
    branches: [ "dev", "test", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # pytest + pytest-cov + pytest-dotenv come from requirements_dev.txt.
        # Required by pyproject.toml's addopts (--cov=autonomous,
        # --cov-reset, --no-cov-on-fail) and env_files (tests/.testenv).
        # Installing the dev file here keeps CI in sync with `make tests`
        # locally — without it, pytest fails to parse its own arguments.
        if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
        # Extras: hermetic tests under tests/unit/ exercise optional-feature
        # code paths (PIL for image_cache, google-genai for gemini, redis/rq
        # for taskrunner). The unit suite imports them at collect time, so
        # CI must install all extras to match what `make inittests` provides.
        for extras in requirements-images.txt requirements-ai.txt requirements-tasks.txt requirements-server.txt requirements-github.txt; do
          if [ -f "$extras" ]; then pip install -r "$extras"; fi
        done
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
