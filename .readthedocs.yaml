# Read the Docs config — see https://docs.readthedocs.io/en/stable/config-file/v2.html
# Auto-builds on every push; serves at https://autonomous-app.readthedocs.io/

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  # Treat warnings as errors so broken cross-refs or stale autosummary
  # entries surface as red builds, not silently-bad output.
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
    - method: pip
      path: .
      extra_requirements:
        # `[all]` pulls every feature extra so autodoc has real imports
        # to introspect (avoids autodoc_mock_imports falling back to
        # signature: (*args, **kwargs) on every Gemini / PIL / RQ class).
        - all

formats:
  - htmlzip
